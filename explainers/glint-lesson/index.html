<title>看懂划痕亮线</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

  color-scheme:dark;

  --cream:#ebe3cf; --cream2:#e2d8c0; --ink:#1b2224; --ink2:#46504f; --muted:#8fa4a2; --text:#e7dec8;
  --d:#b53d2c; --r:#256a92; --s:#467725; --n:#8f610c; --accent:#d04b40;
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--text)}
body{font-family:var(--sans);font-size:16px;line-height:1.75}
.wrap{max-width:1500px;margin:0 auto;padding-inline:clamp(16px,2.6vw,36px);padding-block:22px 40px}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-bottom:14px}
header.top h1{font-family:var(--serif);font-weight:900;font-size:clamp(24px,3vw,34px);margin:0;letter-spacing:.04em}
header.top p{margin:0;color:var(--muted);font-size:14px}
.lesson{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (min-width:1100px){.lesson{grid-template-columns:minmax(0,1fr) 440px;align-items:start}
  .card{position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px);max-height:calc(100vh - 28px);overflow:auto}}
.stagebox{min-width:0}
#frame{position:relative;aspect-ratio:16/9;width:100%;border-radius:4px;overflow:hidden;background:#10201f;box-shadow:0 24px 70px rgba(0,0,0,.5),0 0 0 1px var(--line)}
canvas{display:block;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none}
#hint{position:absolute;right:12px;top:12px;font-size:13px;line-height:1.3;color:#1b2224;background:rgba(235,227,207,.92);border-radius:3px;padding:6px 10px;box-shadow:0 4px 12px rgba(0,0,0,.3);pointer-events:none}
#hint:empty{display:none}
.transport{display:flex;align-items:center;gap:10px;margin-top:10px}
.transport input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
button.b{font:500 13px/1 var(--sans);color:var(--text);background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap}
button.b:hover{border-color:var(--line2)}
button.b[aria-pressed="true"]{background:var(--text);color:var(--ground);border-color:var(--text)}
button.b.primary{background:var(--accent);border-color:var(--accent);color:#fff6ee}
button:focus-visible,input:focus-visible,li:focus-visible{outline:2px solid #f2c65c;outline-offset:2px}
.nav{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
#dots{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0;flex:1}
#dots button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--muted);font:500 13px/1 var(--mono);cursor:pointer}
#dots button.seen{color:var(--text);border-color:var(--line2)}
#dots button.on{background:var(--cream);color:var(--ink);border-color:var(--cream)}

.card{min-width:0;overflow-x:hidden;background:var(--cream);color:var(--ink);border-radius:3px;padding:22px 24px 20px;box-shadow:0 18px 50px rgba(0,0,0,.4);
  background-image:radial-gradient(ellipse at 20% 0%,rgba(255,255,255,.35),rgba(255,255,255,0) 60%),radial-gradient(ellipse at 100% 100%,rgba(120,100,60,.12),rgba(0,0,0,0) 60%)}
.card .no{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--ink2)}
.card h2{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.3;margin:4px 0 12px;text-wrap:balance}
ol.beats{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:4px}
ol.beats li{min-width:0;overflow-wrap:anywhere}
ol.beats li{position:relative;padding:8px 10px 8px 30px;border-radius:3px;cursor:pointer;transition:opacity .25s,background .25s;font-size:15.5px;line-height:1.75}
ol.beats li::before{content:"";position:absolute;left:11px;top:17px;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ink2)}
ol.beats li.past::before{background:var(--ink2)}
ol.beats li.future{opacity:.42}
ol.beats li.now{background:rgba(255,250,236,.75);box-shadow:inset 3px 0 0 var(--accent)}
ol.beats li.now::before{background:var(--accent);border-color:var(--accent)}
ol.beats li b{font-weight:700}
mjx-container[jax="SVG"][display="true"]{margin:.5em 0 !important;max-width:100%;overflow-x:auto;overflow-y:hidden}
.ctrls{margin-top:14px;display:grid;gap:10px}
.ctrls:empty{display:none}
.ctl label{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2)}
.ctl output{font-family:var(--mono);color:var(--ink)}
.ctl input{width:100%;accent-color:var(--accent)}
.ctrls .row{display:flex;flex-wrap:wrap;gap:8px}
.ctrls button{font:500 13px/1 var(--sans);color:var(--ink);background:rgba(255,255,255,.4);border:1px solid rgba(27,34,36,.25);border-radius:999px;padding:8px 13px;cursor:pointer}
.ctrls button[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
.legend{margin-top:14px;padding-top:10px;border-top:1px solid rgba(27,34,36,.15);display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink2)}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid;vertical-align:middle;margin-right:5px;position:relative;top:-2px}
.foot{margin-top:18px;color:var(--muted);font-size:13px}
.foot a{color:var(--text)}
@media (prefers-reduced-motion: reduce){ol.beats li{transition:none}}

<div class="wrap">
  <header class="top">
    <h1>看懂划痕亮线</h1>
    <p>14 步，从镜子讲到 y = 1/x。动画播到哪一句，右边就亮到哪一句；点任意一句可以回到那一刻。</p>
  </header>
  <div class="lesson">
    <div class="stagebox">
      <div id="frame">
        <canvas id="stage" width="1920" height="1080" role="img" aria-label="讲解动画"></canvas>
        <div id="hint"></div>
      </div>
      <div class="transport">
        <button class="b" id="play" type="button">暂停</button>
        <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="本步时间轴">
        <button class="b" id="replay" type="button">重播这一步</button>
      </div>
      <nav class="nav" aria-label="步骤">
        <button class="b" id="prev" type="button">← 上一步</button>
        <ol id="dots"></ol>
        <button class="b primary" id="next" type="button">下一步 →</button>
      </nav>
    </div>
    <section class="card" id="card" aria-live="polite">
      <div class="no" id="stepNo"></div>
      <h2 id="stepTitle"></h2>
      <ol class="beats" id="beats"></ol>
      <div class="ctrls" id="ctrls"></div>
      <div class="legend">
        <span><i style="border-color:#b53d2c"></i>d̂ 入射光</span>
        <span><i style="border-color:#256a92"></i>r̂ 射向眼睛</span>
        <span><i style="border-color:#8f610c"></i>n̂ 法线</span>
        <span><i style="border-color:#467725"></i>ŝ 划痕走向</span>
      </div>
    </section>
  </div>
  <p class="foot">键盘：← → 换步，空格 暂停/继续。完整推导页：<a href="https://claude.ai/artifact/FF3J57BHhRTE2jRpjprypV" target="_blank" rel="noopener">划痕里的双曲线</a> · 短片：<a href="https://claude.ai/artifact/4ySiHuqnxAzzRDcrgt5sUp" target="_blank" rel="noopener">亮线之歌</a></p>
</div>
